# Calendar Notifier Configuration with Prometheus Metrics and Heartbeat
# This example shows how to enable Prometheus metrics endpoint and NATS heartbeat publishing

nats:
  url: "nats://localhost:4222"
  subject: "calendar.notifications"

  # Heartbeat configuration for liveness monitoring
  heartbeat:
    enabled: true                     # Enable heartbeat publishing
    subject_prefix: "heartbeat."      # Subject prefix for heartbeat messages (default: "heartbeat.")
    description: "calendar-notifier"  # Service description (default: "calendar-notifier")
    interval: 1m                      # Heartbeat interval (default: 1m)
    grace_period: 3m                  # Grace period before alerting (default: 3x interval)
    # skippable: 2                    # Optional: number of consecutive misses before alerting

# Metrics configuration
metrics:
  enabled: true      # Enable Prometheus metrics endpoint
  address: "0.0.0.0" # Listen on all interfaces (default)
  port: 9090         # Metrics port (default)

calendars:
  # Example iCal calendar
  - name: "my-calendar"
    type: "ical"
    url: "https://example.com/calendar.ics"
    poll_interval: 5m

defaults:
  # Default notification intervals if event has no alarms (in minutes)
  notification_intervals:
    - 15  # 15 minutes before
    - 5   # 5 minutes before

  # Always send a final reminder this many minutes before each event
  # This is in addition to any other alarms configured
  # Use 0 to get a notification exactly at event start time
  final_reminder_minutes: 0

  # Grace period for late notifications (allows notifications that are slightly in the past)
  # This prevents missing notifications due to timing issues or clock skew
  # Default is 60s if not specified
  notification_grace_period: 60s

  default_severity: "normal"

logging:
  level: "info"    # debug, info, warn, error
  format: "json"   # json or text
